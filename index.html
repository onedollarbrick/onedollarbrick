<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One Dollar Brick</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0e0e11;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}
h1{
  font-family:"Press Start 2P", monospace;
  margin:26px 0 6px;
  font-size:22px;
  color:#ffd54f;
}
#heroStatement{text-align:center;margin:22px 0 28px}
.heroMain,.heroSub{
  font-family:"Press Start 2P", monospace;
  font-size:18px;
  color:#ffd54f;
}
.heroMain{margin-bottom:18px}
#aboutToggle{
  font-family:"Press Start 2P", monospace;
  font-size:14px;
  margin-bottom:18px;
  cursor:pointer;
  color:#6fcf97;
}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:18px;
}
button{
  font-family:"Press Start 2P", monospace;
  font-size:11px;
  padding:8px 12px;
  border-radius:8px;
  border:0;
  cursor:pointer;
}
button.active{outline:3px solid #fff}
.t1{background:#f2c94c;color:#1a1a1a}
.t5{background:#f2994a;color:#1a1a1a}
.t10{background:#5fb3ff;color:#0e0e11}
.tmore{background:linear-gradient(135deg,#e0e0e0,#bdbdbd);color:#1a1a1a}
.tshare{background:#ff6fd8;color:#1a1a1a}
input{
  padding:8px;
  border-radius:6px;
  border:0;
  width:160px;
}
.progress-wrap{width:100%;max-width:1100px;margin-top:18px}
.progress-bar{
  height:18px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffd54f,#ff8c42);
}
.progressLabel{text-align:center;font-size:20px;margin-top:14px}
.progressSub{font-size:15px;opacity:.7;text-align:center;margin-top:6px}
.wall{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:14px;
  margin-top:22px;
  background:#151515;
  border-radius:12px;
}
.row{display:grid;grid-template-columns:repeat(14,78px);gap:6px}
.row.offset{margin-left:39px}
.brick{
  width:78px;height:44px;
  background:linear-gradient(#555,#444);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Press Start 2P", monospace;
  font-size:10px;
  cursor:pointer;
}
.brick.placed{cursor:default}
.brick.preview{outline:2px dashed #fff;opacity:.6}
.footerNote{
  font-size:11px;
  opacity:.55;
  margin:28px 0 30px;
  text-align:center;
  max-width:520px;
  line-height:1.6;
}
</style>
</head>

<body>

<h1>ONE DOLLAR BRICK</h1>

<div id="heroStatement">
  <div class="heroMain">Can the internet buy peace for 1 dollar?</div>
  <div class="heroSub">I am trying to find out.</div>
</div>

<div class="controls">
  <button class="t1 active" onclick="selectTier(this)">1$</button>
  <button class="t5" onclick="selectTier(this)">5$</button>
  <button class="t10" onclick="selectTier(this)">10$</button>
  <input id="textInput" placeholder="Text (6)">
  <button onclick="armBrick()">SET BRICK</button>
</div>

<div class="progress-wrap">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progressLabel">
    Placed: <strong><span id="brickCount">0</span> bricks</strong>
  </div>
  <div class="progressSub">Goal: buying peace</div>
</div>

<div class="wall" id="wall"></div>

<div class="footerNote">
Payments<br>
Bricks represent real contributions.<br>
Payments are processed via Stripe.
</div>

<script>
const SUPABASE_URL="https://jftttrosqjvcdgummhlm.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_yeQRHdvKpKZeFnyn0qBNVA_jegb2_dc";
const supabase=supabaseJs.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const wall=document.getElementById("wall");
const rowsStart=7, cols=14;
let armed=false, bricksPlaced=0;

for(let i=0;i<rowsStart;i++) addRow();

function addRow(){
  const row=document.createElement("div");
  row.className="row";
  if(wall.children.length%2===1) row.classList.add("offset");
  for(let c=0;c<cols;c++){
    const b=document.createElement("div");
    b.className="brick";
    b.onclick=()=>placeBrick(b);
    b.onmouseenter=()=>armed&&!b.classList.contains("placed")&&b.classList.add("preview");
    b.onmouseleave=()=>b.classList.remove("preview");
    row.appendChild(b);
  }
  wall.appendChild(row);
}

function selectTier(el){
  document.querySelectorAll(".controls button").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
}

function armBrick(){
  armed=true;
}

textInput.oninput=e=>e.target.value=e.target.value.slice(0,6);

async function placeBrick(brick){
  if(!armed||brick.classList.contains("placed"))return;

  const row=[...wall.children].indexOf(brick.parentElement);
  const col=[...brick.parentElement.children].indexOf(brick);
  const text=textInput.value;
  const tierText=document.querySelector(".controls .active").innerText;
  const tier=tierText==="1$"?1:tierText==="5$"?5:10;

  const {error}=await supabase.from("bricks").insert({row,col,text,tier});
  if(error){alert("Save failed");return;}

  activateBrick(brick,text,tier);
  armed=false;
  bricksPlaced++;
  updateProgress();
  maybeGrowWall();
}

function activateBrick(brick,text,tier){
  brick.textContent=text;
  brick.classList.add("placed");
  brick.style.background=
    tier===1?"#f2c94c":tier===5?"#f2994a":"#5fb3ff";
  brick.style.color="#000";
}

function updateProgress(){
  brickCount.textContent=bricksPlaced;
  progressFill.style.width=(bricksPlaced/1000000*100)+"%";
}

function isRowFull(row){
  return [...row.children].every(b=>b.classList.contains("placed"));
}

function maybeGrowWall(){
  while(wall.children.length && isRowFull(wall.children[wall.children.length-1])){
    addRow();
  }
}

async function loadPlacedBricks(){
  const {data}=await supabase.from("bricks").select("*");
  data.forEach(b=>{
    while(wall.children.length<=b.row) addRow();
    const brick=wall.children[b.row].children[b.col];
    activateBrick(brick,b.text,b.tier);
  });
  bricksPlaced=data.length;
  updateProgress();
  maybeGrowWall();
}

loadPlacedBricks();
</script>

</body>
</html>
