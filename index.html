<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One Dollar Brick</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ⚠️ DEIN KOMPLETTES CSS UNVERÄNDERT */
</style>
</head>

<body>

<!-- ⚠️ DEIN KOMPLETTES HTML UNVERÄNDERT -->

<script>
/* ============================
   SUPABASE SETUP
============================ */
const SUPABASE_URL = "https://jftttrosqjvcdgummhlm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yeQRHdvKpKZeFnyn0qBNVA_jegb2_dc";
const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================
   WALL SETUP (UNVERÄNDERT)
============================ */
const wall = document.getElementById("wall");
const rowsStart = 7;
const cols = 14;
let armed = false;
let paid = false;
let bricksPlaced = 0;

for (let r = 0; r < rowsStart; r++) addRow(false);

function addRow(prepend) {
  const row = document.createElement("div");
  row.className = "row";
  if (wall.children.length % 2 === 1) row.classList.add("offset");

  for (let c = 0; c < cols; c++) {
    const b = document.createElement("div");
    b.className = "brick";
    b.dataset.row = prepend ? 0 : wall.children.length;
    b.dataset.col = c;
    b.onclick = () => placeBrick(b);
    row.appendChild(b);
  }
  prepend ? wall.prepend(row) : wall.appendChild(row);
}

/* ============================
   LOAD BRICKS FROM SUPABASE
============================ */
async function loadBricks() {
  const { data, error } = await supabase
    .from("bricks")
    .select("*");

  if (error) {
    console.error(error);
    return;
  }

  data.forEach(b => {
    const row = wall.children[b.row];
    if (!row) return;
    const brick = row.children[b.col];
    if (!brick) return;

    brick.textContent = b.text;
    brick.classList.add("placed");

    if (b.tier === 1) brick.style.background = "#f2c94c";
    if (b.tier === 5) brick.style.background = "#f2994a";
    if (b.tier === 10) brick.style.background = "#5fb3ff";

    bricksPlaced++;
  });

  brickCount.textContent = bricksPlaced;
  progressFill.style.width = Math.min(bricksPlaced / 1000000 * 100, 100) + "%";
}

loadBricks();

/* ============================
   ARM BRICK (PAYMENT FLOW)
============================ */
if (new URLSearchParams(window.location.search).get("paid") === "1") {
  paid = true;
}

function armBrick() {
  if (!paid) {
    const tier = document.querySelector(".controls .active").innerText;
    let url = "";
    if (tier === "1$") url = "https://buy.stripe.com/test_8x2cN7c2nfZlaHP369gnK03";
    if (tier === "5$") url = "https://buy.stripe.com/test_9B6eVf6I328veY58qtgnK04";
    if (tier === "10$") url = "https://buy.stripe.com/test_00w7sNd6r9AX4jreORgnK05";
    localStorage.setItem("brick_text", textInput.value);
    localStorage.setItem("brick_tier", tier.replace("$",""));
    window.location.href = url;
    return;
  }
  armed = true;
}

/* ============================
   PLACE + SAVE BRICK
============================ */
async function placeBrick(brick) {
  if (!armed || brick.classList.contains("placed")) return;

  const text = localStorage.getItem("brick_text") || "";
  const tier = parseInt(localStorage.getItem("brick_tier"));

  brick.textContent = text;
  brick.classList.add("placed");

  if (tier === 1) brick.style.background = "#f2c94c";
  if (tier === 5) brick.style.background = "#f2994a";
  if (tier === 10) brick.style.background = "#5fb3ff";

  await supabase.from("bricks").insert({
    row: Array.from(wall.children).indexOf(brick.parentElement),
    col: Array.from(brick.parentElement.children).indexOf(brick),
    text: text,
    tier: tier
  });

  bricksPlaced++;
  brickCount.textContent = bricksPlaced;
  progressFill.style.width = Math.min(bricksPlaced / 1000000 * 100, 100) + "%";

  armed = false;
  paid = false;
  localStorage.clear();

  shareTitle.textContent = "You placed a brick!";
  shareText.textContent =
    "I placed a brick to help buy peace instead of escalating conflict.\n🧱 onedollarbrick.com";
  shareOverlay.style.display = "flex";
}
</script>
</body>
</html>
